server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't cache the HTML shell so updates show up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Cache the game assets
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
