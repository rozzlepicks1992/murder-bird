# Kubernetes workload for Murder Bird.
# Replace OWNER/REPO with your GitHub repo (lowercase), e.g. ghcr.io/jane/murder-bird:latest
apiVersion: apps/v1
kind: Deployment
metadata:
  name: murder-bird
  labels:
    app: murder-bird
spec:
  replicas: 2
  selector:
    matchLabels:
      app: murder-bird
  template:
    metadata:
      labels:
        app: murder-bird
    spec:
      containers:
        - name: murder-bird
          image: ghcr.io/OWNER/REPO:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: murder-bird
  labels:
    app: murder-bird
spec:
  selector:
    app: murder-bird
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
# Optional: expose it via an Ingress controller (edit the host).
# Delete this block if you use `kubectl port-forward` or a LoadBalancer instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: murder-bird
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: murder-bird.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: murder-bird
                port:
                  number: 80
